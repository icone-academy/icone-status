# Upptime remains the availability engine and historical source of truth.
owner: icone-academy
repo: icone-status
user-agent: icone-academy-status

assignees:
  - meneeses

# Preserve short incidents so the custom page and alert dispatcher can keep a
# complete, real incident history.
skipDeleteIssues: true

sites:
  # The historical names are intentionally preserved because Upptime derives
  # their slugs from the name (plataforma-app, api-liveness and
  # api-health-completo).
  - name: Plataforma (App)
    url: https://www.icone.academy
    maxResponseTime: 5000
    expectedStatusCodes:
      - 200

  - name: API — Liveness
    url: https://api.icone.academy/health/live
    maxResponseTime: 3000
    expectedStatusCodes:
      - 200

  - name: API — Health Completo
    url: https://api.icone.academy/health/ready
    maxResponseTime: 5000
    expectedStatusCodes:
      - 200
    __dangerous__body_degraded: '"status":"degraded"'

  - name: Pagamentos e webhooks
    url: https://api.icone.academy/health/operations
    maxResponseTime: 5000
    expectedStatusCodes:
      - 200
    __dangerous__body_degraded: '"status":"degraded"'

  - name: Arquivos
    url: https://files.icone.academy/health
    maxResponseTime: 5000
    expectedStatusCodes:
      - 200

status-website:
  cname: status.icone.academy
  name: ICone Status
  description: Disponibilidade dos serviços de produção da ICone Academy
  theme: light
  favicon: https://www.icone.academy/favicon.ico
  navbar:
    - title: Plataforma
      href: https://www.icone.academy
    - title: Suporte
      href: mailto:suporte@icone.academy

workflowSchedule:
  uptime: "*/5 * * * *"
  responseTime: "0 */6 * * *"
  graphs: "15 0 * * *"
  summary: "30 0 * * *"
