name: Publicar status customizado

on:
  workflow_run:
    workflows: ["Uptime CI"]
    types: [completed]
  push:
    branches: [master]
    paths:
      - ".github/scripts/status/**"
      - ".github/scripts/logo.png"
      - ".github/workflows/static-site.yml"
      - ".upptimerc.yml"
      - "CNAME"
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-status
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Gerar e publicar página
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout do estado mais recente
        uses: actions/checkout@v6
        with:
          ref: master

      - name: Testar parser e interface
        run: node --test .github/scripts/status/status.test.mjs

      - name: Buscar incidentes reais nas Issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/status/fetch-incidents.mjs incidents.json

      - name: Gerar site estático
        run: node .github/scripts/status/generate-site.mjs

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar
        id: deploy
        uses: actions/deploy-pages@v4
